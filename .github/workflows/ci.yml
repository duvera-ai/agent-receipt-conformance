name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo 'run gofmt'; gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      # The suite must discriminate: a verifier that only checks signatures has
      # to come out NON-CONFORMANT, or the corpus measures nothing. `true`
      # accepts every receipt unconditionally, which is the degenerate case.
      - name: envelope-blind verifier must not pass
        run: |
          if go run ./runner --verifier "true {jwks} {manifest} {inputs} {receipt}"; then
            echo "a verifier that accepts everything passed the corpus"
            exit 1
          fi
